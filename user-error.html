
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Renewable Energy builds intelligent clean energy infrastructure for a resilient future.">
  <title>Energy not found · Renewable Energy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    
  :root{--ink:#050b09;--forest:#071a14;--deep:#0b2a20;--panel:rgba(16,40,30,.72);--line:rgba(188,226,199,.14);--cream:#e8e5d8;--muted:#a7b3ad;--emerald:#10b981;--lime:#a3e635;--gold:#d4a72c;--danger:#f87171;--shadow:0 24px 80px rgba(0,0,0,.28);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--cream);background:var(--ink);font-synthesis:none;text-rendering:optimizeLegibility}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;overflow-x:hidden}
  body{margin:0;min-width:320px;background:radial-gradient(circle at 80% 0%,rgba(16,185,129,.12),transparent 28rem),var(--ink);line-height:1.6;overflow-x:hidden}
  body.menu-open{overflow:hidden}
  a{color:inherit;text-decoration:none}
  button,input,textarea{font:inherit}
  button{cursor:pointer}
  img{max-width:100%;display:block}
  h1,h2,h3,h4,p{margin:0}
  h1,h2,h3,h4{line-height:1.12;letter-spacing:-.04em}
  .wrap{width:min(1180px,calc(100% - 48px));margin:auto}
  .eyebrow{display:flex;align-items:center;gap:10px;color:var(--lime);font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .eyebrow:before{content:"";width:28px;height:1px;background:var(--lime)}
  .muted{color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;border-radius:999px;padding:13px 20px;font-size:.82rem;font-weight:800;letter-spacing:.04em;transition:.28s ease}
  .btn-primary{background:var(--lime);color:#112116;box-shadow:0 0 0 0 rgba(163,230,53,.22)}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(163,230,53,.18)}
  .btn-ghost{border-color:var(--line);background:rgba(255,255,255,.03);color:var(--cream)}
  .btn-ghost:hover{border-color:rgba(163,230,53,.55);color:var(--lime);transform:translateY(-3px)}
  .error-page{min-height:100vh;display:grid;place-items:center;padding:30px;background:linear-gradient(135deg,rgba(5,11,9,.9),rgba(5,11,9,.42)),url(https://images.pexels.com/photos/13542219/pexels-photo-13542219.jpeg?auto=compress&cs=tinysrgb&fm=webp&w=1200) center/cover}
  .error-box{text-align:center;padding:50px 30px;border:1px solid rgba(232,229,216,.16);border-radius:26px;background:rgba(7,26,20,.66);backdrop-filter:blur(18px);max-width:650px}
  .error-box strong{display:block;font-size:clamp(6rem,16vw,12rem);line-height:.8;color:var(--lime);letter-spacing:-.1em}
  .error-box h1{font-size:2.2rem;margin:28px 0 12px}
  .error-box p{color:var(--muted);margin-bottom:26px}
  .error-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .reveal{opacity:0;transform:translateY(20px);transition:.7s ease}
  .reveal.visible{opacity:1;transform:none}
  @media(max-width:640px){.wrap{width:min(100% - 32px,1180px)}
  .error-box{padding:34px 20px}
  .error-box h1{font-size:1.8rem}
  }

  </style>
</head>

<body>
  <main class="error-page">
    <div class="error-box reveal visible">
      <div class="eyebrow" style="justify-content:center">Signal lost</div><strong>404</strong>
      <h1>Energy not found.</h1>
      <p>The page you're looking for has moved beyond the grid. Let's get you back to somewhere useful.</p>
      <div class="error-actions"><a class="btn btn-primary" href="user-dashboard.html">Go to Dashboard </a>
        <button class="btn btn-ghost" id="back">Go back</button>
      </div>
    </div>
  </main>
  <script>
    document.querySelector('#back').addEventListener('click', () => history.length > 1 ? history.back() : location.href = 'index.html')
  </script>
  <script>
    const observer = new IntersectionObserver(entries => entries.forEach(e => e.isIntersecting && e.target.classList.add('visible')), {
      threshold: .12
    });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    document.querySelectorAll('[data-counter]').forEach(el => {
      const end = Number(el.dataset.counter);
      let done = false;
      const co = new IntersectionObserver(es => {
        if (es[0].isIntersecting && !done) {
          done = true;
          let n = 0;
          const step = Math.max(1, Math.ceil(end / 42));
          const tick = () => {
            n = Math.min(end, n + step);
            el.textContent = n.toLocaleString() + (el.dataset.suffix || '');
            if (n < end) requestAnimationFrame(tick)
          };
          tick()
        }
      }, {
        threshold: .6
      });
      co.observe(el)
    });
  </script>
</body>

</html>
